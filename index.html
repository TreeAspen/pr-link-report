<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR 链接报告生成器</title>
<style>
  :root{
    --navy:#1b2a4e;
    --accent:#e2245e;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --bg:#f3f4f6;
    --panel:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px;
  }
  .app{display:grid;grid-template-columns:380px 1fr;height:100vh}

  /* ---------- 左侧控制台 ---------- */
  .panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
  .titlebar{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
  .panel h1{font-size:16px;margin:0;flex:1}
  .langsw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
  .langsw button{border:0;border-radius:0;padding:4px 9px;font-size:11.5px;background:#fff;color:var(--muted);line-height:1.4}
  .langsw button.on{background:var(--navy);color:#fff;font-weight:700}
  .tutlink{
    display:block;margin:0 0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    font-size:12.5px;color:var(--navy);text-decoration:none;background:#f8fafc;font-weight:600;
  }
  .tutlink:hover{background:#eef2f7;border-color:#c7d2e0}
  .panel .hint{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 14px}
  .grp{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
  .grp>h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  input[type=text],input[type=color],select,textarea{
    width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:#fff;color:var(--ink)
  }
  input[type=file]{width:100%;font-size:11px}
  textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;resize:vertical}
  input[type=color]{padding:2px;height:32px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  /* 主题色预设 */
  .swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .sw{padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;display:flex;width:38px;height:26px;cursor:pointer}
  .sw i{display:block;height:100%}
  .sw i:first-child{width:70%}
  .sw i:last-child{width:30%}
  .sw:hover{border-color:#9ca3af}
  .sw.on{outline:2px solid var(--navy);outline-offset:1px;border-color:transparent}
  button{
    font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer
  }
  button:hover{background:#f9fafb}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  button.primary:hover{filter:brightness(1.15)}
  button.danger{color:#b91c1c}
  button.wide{width:100%;margin-top:8px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .sec-item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fcfcfd}
  .sec-item .head{display:flex;align-items:center;gap:6px}
  .sec-item .head strong{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sec-item .head button{padding:3px 7px;font-size:12px;line-height:1}
  .sec-body{margin-top:8px;display:none}
  .sec-item.open .sec-body{display:block}
  .count{color:var(--muted);font-size:11px}
  .warn{background:#fef3c7;border:1px solid #fde68a;color:#92400e;font-size:12px;padding:8px;border-radius:6px;line-height:1.6}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:11.5px;padding:7px 8px;border-radius:6px;line-height:1.6;margin-top:8px}
  .sub-h{font-size:11px;font-weight:700;color:var(--navy);margin:12px 0 0;padding-top:8px;border-top:1px dashed var(--line)}

  /* ---------- 右侧画布 ---------- */
  .stage{overflow:auto;padding:24px 24px 70px;display:flex;justify-content:center;align-items:flex-start;position:relative}
  .paper{
    width:210mm;min-height:297mm;background:#fff;padding:14mm 12mm;
    box-shadow:0 2px 16px rgba(0,0,0,.12);
  }
  /* 选中条目的浮动工具条 */
  .selbar{
    position:fixed;bottom:14px;left:calc(380px + 24px);right:24px;z-index:20;
    background:var(--navy);color:#fff;border-radius:8px;padding:8px 12px;
    display:none;align-items:center;gap:10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.25)
  }
  .selbar.on{display:flex}
  .selbar b{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .selbar .sp{flex:1}
  .selbar button{padding:5px 10px;font-size:12px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
  .selbar button:hover{background:rgba(255,255,255,.26)}

  /* ---------- 文档样式 ---------- */
  .doc-head{border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .doc-head img{max-height:44px}
  .brand{font-size:20px;font-weight:800;color:var(--navy);line-height:1.1;letter-spacing:-.01em}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em;margin-top:3px}
  .doc-title{font-size:24px;font-weight:800;line-height:1.25;margin:18px 0 6px}
  .doc-sub{color:var(--muted);font-size:12px;margin:0 0 14px}
  .doc-intro{font-size:12.5px;line-height:1.75;color:#374151;margin:0 0 18px}
  .doc-cover{margin:0 0 18px}
  .doc-cover img{width:100%;border:1px solid var(--line);border-radius:4px;display:block}
  .figcap{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5;text-align:center}

  .toc{background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:20px}
  .toc h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .toc ol{margin:0;padding-left:18px;columns:2;column-gap:24px;font-size:12.5px;line-height:1.9}
  .toc a{color:var(--navy);text-decoration:none}

  .section{margin-bottom:22px}
  .sec-bar{
    background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;
    padding:7px 12px;border-left:5px solid var(--accent);margin-bottom:10px;
    break-after:avoid;page-break-after:avoid;
  }
  .sec-desc{font-size:12px;line-height:1.7;color:#4b5563;margin:0 0 10px}
  .sec-hero{margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}
  .sec-hero img{width:100%;border:1px solid var(--line);border-radius:4px;display:block}

  .cards{display:grid;gap:6px}
  .cards.c1{grid-template-columns:1fr}
  .cards.c2{grid-template-columns:1fr 1fr}
  .cards.c3{grid-template-columns:repeat(3,1fr)}
  .cards.c4{grid-template-columns:repeat(4,1fr)}
  .card{
    border:1px solid var(--line);border-radius:3px;padding:11px 13px;
    display:flex;align-items:center;gap:10px;min-height:52px;
    break-inside:avoid;page-break-inside:avoid;
  }
  .card .txt{flex:1;min-width:0}
  .card a{font-weight:700;font-size:13px;color:#111827;text-decoration:none;display:block;line-height:1.3}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
  .card img.logo{max-height:28px;max-width:100px;object-fit:contain;flex:0 0 auto;margin-left:8px}
  .card.center{justify-content:center;text-align:center}
  .card.center .txt{flex:0 1 auto}

  /* 品牌方块：有 logo 显示 logo，无 logo 显示名称（对应报告首页那排方块） */
  .tiles{display:grid;gap:8px}
  .tiles.t2{grid-template-columns:1fr 1fr}
  .tiles.t3{grid-template-columns:repeat(3,1fr)}
  .tiles.t4{grid-template-columns:repeat(4,1fr)}
  .tile{
    border:1px solid var(--line);border-radius:3px;min-height:68px;padding:13px 18px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    break-inside:avoid;page-break-inside:avoid;
  }
  .tile img{max-height:36px;max-width:100%;object-fit:contain}
  .tile a,.tile span.nm{font-weight:800;font-size:13.5px;color:#111827;text-decoration:none;line-height:1.3}

  /* 截图卡片 */
  .cards.s1{grid-template-columns:1fr;gap:14px}
  .cards.s2{grid-template-columns:1fr 1fr;gap:12px}
  .cards.s3{grid-template-columns:repeat(3,1fr);gap:10px}
  .shot{
    margin:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff;
    break-inside:avoid;page-break-inside:avoid;
  }
  .shot .frame{
    background:#f8fafc;border-bottom:1px solid var(--line);overflow:hidden;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  /* 截图：铺满并对齐顶部（网页截图的关键信息在上方） */
  .shot .frame img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
  .cards.s1 .shot .frame{height:100mm}
  .cards.s2 .shot .frame{height:52mm}
  .cards.s3 .shot .frame{height:36mm}
  /* logo 占位：按原始尺寸居中，四周留白；只许缩小不许放大，避免糊 */
  .shot .frame img.as-logo{
    width:auto;height:auto;object-fit:contain;background:#fff;
    max-width:calc(100% - 48px);max-height:calc(100% - 34px);
  }
  .cards.s3 .shot .frame img.as-logo{max-width:calc(100% - 28px);max-height:calc(100% - 20px)}
  .shot .frame.logo-bg{background:#fff}   /* logo 多为白底，底色统一成白，避免出现白方块 */
  .shot .frame.empty{
    display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:11px;
    height:36mm;background:repeating-linear-gradient(45deg,#f9fafb,#f9fafb 8px,#f3f4f6 8px,#f3f4f6 16px)
  }
  .shot figcaption{padding:8px 10px}
  .shot figcaption a{font-weight:700;font-size:12.5px;color:var(--navy);text-decoration:none;line-height:1.35;display:block}
  .shot figcaption .sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
  .drop{outline:2px dashed var(--accent) !important;outline-offset:2px}

  /* 三栏链接列表：用 grid 按「行优先」排，和原报告的阅读顺序一致 */
  .linklist{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 18px;font-size:11.5px;line-height:1.7;margin:0;padding:0;list-style:none}
  .linklist li{break-inside:avoid;page-break-inside:avoid;padding-left:11px;position:relative}
  .linklist li::before{content:'';position:absolute;left:0;top:6.5px;width:4px;height:4px;background:#111827}
  .linklist a{color:var(--navy)}
  .linklist .sub{color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px}
  .chip a{color:var(--navy);text-decoration:none;font-weight:600}

  table.tbl{width:100%;border-collapse:collapse;font-size:12px}
  table.tbl th{background:#f3f4f6;text-align:left;padding:7px 9px;border:1px solid var(--line);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  table.tbl td{padding:7px 9px;border:1px solid var(--line);vertical-align:top}
  table.tbl a{color:var(--navy)}
  table.tbl tr{break-inside:avoid;page-break-inside:avoid}
  table.tbl td img{max-width:100%;display:block}

  /* ---- 世界媒体名录（原报告第 11–12 页）---- */
  .dir-box{background:#f8fafc;border:1px solid var(--line);border-radius:5px;padding:12px 14px;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
  .dir-head{font-weight:700;font-size:12.5px;color:var(--navy);display:flex;align-items:center;gap:7px}
  .dir-head .flag{font-size:15px;line-height:1}
  .dir-head a{color:var(--navy);text-decoration:underline}
  .dir-count{font-size:11.5px;color:var(--muted);margin:7px 0 8px}
  .dir-names{display:grid;grid-template-columns:repeat(3,1fr);gap:1px 18px;font-size:11px;line-height:1.75;color:#374151}
  .dir-names span{padding-left:11px;position:relative;break-inside:avoid}
  .dir-names span::before{content:'';position:absolute;left:0;top:6.5px;width:4px;height:4px;background:#111827}

  /* ---- 社交分享行 ---- */
  .social{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .social a{
    border:1px solid var(--line);border-radius:3px;padding:15px 8px;text-align:center;
    font-weight:800;font-size:13.5px;color:#111827;text-decoration:none;break-inside:avoid;
  }

  /* ---- 报告摘要面板（原报告最后一页）---- */
  .summary{border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;font-size:11.5px;line-height:1.6}
  .summary h4{margin:0 0 3px;font-size:11.5px;font-weight:700}
  .summary p{margin:0 0 12px;color:#374151}
  .summary .muted{color:var(--muted)}
  .summary ul{margin:0 0 12px;padding-left:14px}
  .summary li{margin-bottom:3px}
  .summary li::marker{color:#818cf8}
  .summary a{color:var(--navy);word-break:break-all}
  .sum-fig{display:flex;gap:9px;margin:0 0 12px;break-inside:avoid}
  .sum-fig img{width:90px;height:auto;border:1px solid var(--line);flex:0 0 auto;object-fit:cover}
  .sum-fig .meta{font-size:10.5px;line-height:1.55;color:#374151}

  .doc-foot{margin-top:26px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

  [contenteditable]:focus{outline:2px solid #93c5fd;outline-offset:2px;border-radius:2px}
  .sel-row{outline:2px solid var(--accent);outline-offset:1px}

  /* ---------- 导入弹窗 ---------- */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:10px;width:min(980px,100%);max-height:90vh;overflow:auto;padding:20px}
  .modal h2{margin:0 0 4px;font-size:17px}
  .modal .hint{color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 12px}
  .maprow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
  .prev{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px}
  .prev table{border-collapse:collapse;font-size:12px;width:100%}
  .prev th,.prev td{border:1px solid var(--line);padding:4px 7px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
  .prev th{background:#f9fafb;position:sticky;top:0}
  .prev td.lk{color:#1d4ed8}

  /* ---------- 打印 ---------- */
  @page{size:A4;margin:14mm 12mm}
  @media print{
    body{background:#fff}
    .app{display:block;height:auto}
    .panel,.modal,.selbar,.noprint{display:none !important}
    .stage{padding:0;display:block;overflow:visible}
    .paper{width:auto;min-height:0;padding:0;box-shadow:none}
    a{text-decoration:none}
    .sel-row{outline:none !important}
    .shot .frame.empty{display:none}
    img{max-width:100%}
    .sec-bar,.toc,table.tbl th,.shot .frame{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ 控制台 ============ -->
  <aside class="panel">
    <div class="titlebar">
      <h1 data-i18n="app.title"></h1>
      <div class="langsw" id="langsw">
        <button data-lang="zh">中文</button><button data-lang="en">EN</button>
      </div>
    </div>
    <p class="hint" data-i18n="app.sub"></p>
    <a class="tutlink" id="tutLink" href="tutorial.html" target="_blank" rel="noopener" data-i18n="app.tutorial"></a>

    <div class="grp">
      <h2 data-i18n="g1.h"></h2>
      <button class="primary wide" id="btnImport" data-i18n="g1.import"></button>
      <button class="wide" id="btnMatch" data-i18n="g1.match"></button>
      <div class="btnrow">
        <button id="btnDemo" data-i18n="g1.demo"></button>
        <select id="newType" style="width:auto;flex:1">
          <option value="links"     data-i18n="type.links"></option>
          <option value="directory" data-i18n="type.directory"></option>
          <option value="social"    data-i18n="type.social"></option>
          <option value="summary"   data-i18n="type.summary"></option>
        </select>
        <button id="btnAddSec" data-i18n="g1.add"></button>
      </div>
      <div class="tip" id="libTip"></div>
      <div class="tip" data-i18n-html="g1.shotTip"></div>
    </div>

    <div class="grp">
      <h2 data-i18n="g2.h"></h2>
      <label data-i18n="g2.brand"></label><input type="text" id="fBrand">
      <label data-i18n="g2.tagline"></label><input type="text" id="fTagline">
      <label data-i18n="g2.logo"></label><input type="file" id="fLogo" accept="image/*">
      <label data-i18n="g2.title"></label><textarea id="fTitle" rows="2"></textarea>
      <label data-i18n="g2.subtitle"></label><input type="text" id="fSubtitle">
      <label data-i18n="g2.intro"></label><textarea id="fIntro" rows="3"></textarea>
      <label data-i18n="g2.cover"></label>
      <input type="file" id="fCover" accept="image/*">
      <input type="text" id="fCoverCap" data-i18n-ph="g2.coverCap" style="margin-top:6px">
      <button id="btnCoverDel" style="margin-top:6px;font-size:12px;padding:4px 9px" data-i18n="g2.coverDel"></button>
      <label data-i18n="g2.footer"></label><input type="text" id="fFooter">
      <label data-i18n="g2.theme"></label>
      <div class="swatches" id="swatches"></div>
      <div class="row2" style="margin-top:6px">
        <div><label data-i18n="g2.navy"></label><input type="color" id="fNavy"></div>
        <div><label data-i18n="g2.accent"></label><input type="color" id="fAccent"></div>
      </div>
      <label style="margin-top:10px"><input type="checkbox" id="fToc" style="width:auto"> <span data-i18n="g2.toc"></span></label>
      <label><input type="checkbox" id="fIndex" style="width:auto"> <span data-i18n="g2.index"></span></label>
    </div>

    <div class="grp">
      <h2><span data-i18n="g3.h"></span> <span class="count" id="secCount"></span></h2>
      <div id="secList"></div>
    </div>

    <div class="grp">
      <h2 data-i18n="g4.h"></h2>
      <button class="primary wide" id="btnPrint"   data-i18n="g4.print"></button>
      <button class="wide" id="btnCopyDoc" data-i18n="g4.copyDoc"></button>
      <button class="wide" id="btnDoc"     data-i18n="g4.doc"></button>
      <button class="wide" id="btnHtml"    data-i18n="g4.html"></button>
      <button class="wide" id="btnShots"   data-i18n="g4.shots"></button>
      <div class="btnrow">
        <button id="btnSave" data-i18n="g4.save"></button>
        <button id="btnLoad" data-i18n="g4.load"></button>
        <button class="danger" id="btnReset" data-i18n="g4.reset"></button>
      </div>
      <input type="file" id="fProj" accept=".json" hidden>
      <div class="warn" style="margin-top:12px" data-i18n-html="g4.canva"></div>
      <div class="tip" id="storeInfo"></div>
    </div>
  </aside>

  <!-- ============ 画布 ============ -->
  <main class="stage">
    <div class="paper" id="paper"></div>
  </main>
</div>

<div class="selbar" id="selbar">
  <span data-i18n="sel.picked"></span><b id="selName"></b>
  <span class="sp"></span>
  <span style="opacity:.75" data-i18n="sel.hint"></span>
  <button id="selPick" data-i18n="sel.pick"></button>
  <button id="selDel"  data-i18n="sel.del"></button>
  <button id="selClose">✕</button>
</div>
<input type="file" id="selFile" accept="image/*" hidden>

<!-- ============ 导入弹窗 ============ -->
<div class="modal" id="modal">
  <div class="box">
    <h2 data-i18n="m.h"></h2>
    <p class="hint" data-i18n-html="m.hint"></p>
    <textarea id="pasteBox" rows="5" data-i18n-ph="m.ph"></textarea>
    <label style="margin-top:10px"><input type="checkbox" id="hasHeader" style="width:auto" checked> <span data-i18n="m.header"></span></label>

    <div class="maprow">
      <div><label data-i18n="m.cName"></label><select id="mName"></select></div>

let LANG = 'zh';
try{ LANG = localStorage.getItem('pr-report-lang') === 'en' ? 'en' : 'zh'; }catch(e){}
/** 取文案；值是函数时按参数调用 */
function t(key, ...args){
  const v = (I18N[LANG] && I18N[LANG][key]) ?? I18N.zh[key] ?? key;
  return typeof v === 'function' ? v(...args) : v;
}
function applyLang(){
  document.documentElement.lang = t('html.lang');
  document.title = t('app.title');
  document.querySelectorAll('[data-i18n]').forEach(n=> n.textContent = t(n.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(n=> n.innerHTML = t(n.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(n=> n.placeholder = t(n.dataset.i18nPh));
  document.querySelectorAll('#langsw button').forEach(b=> b.classList.toggle('on', b.dataset.lang === LANG));
  Object.keys(LAYOUT_LABELS).forEach(k=> LAYOUT_LABELS[k] = t('lay.'+k));
  const sel = document.getElementById('mLayout');
  const keep = sel.value || 'c2';
  sel.innerHTML = Object.entries(LAYOUT_LABELS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');
  sel.value = keep;
}
function setLang(l){
  LANG = (l === 'en') ? 'en' : 'zh';
  try{ localStorage.setItem('pr-report-lang', LANG); }catch(e){}
  applyLang();
  render();
}
document.getElementById('langsw').addEventListener('click', e=>{
  const b = e.target.closest('button[data-lang]');
  if(b) setLang(b.dataset.lang);
});

/* =========================================================
   0. 图片仓库：IndexedDB（localStorage 放不下截图）
   ========================================================= */
const IDB = (()=>{
  let dbp;
  function db(){
    if(!dbp) dbp = new Promise((res,rej)=>{
      const r = indexedDB.open('pr-report-imgs',1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('imgs');
      r.onsuccess = ()=> res(r.result);
      r.onerror  = ()=> rej(r.error);
    });
    return dbp;
  }
  const run = (mode, fn) => db().then(d => new Promise((res,rej)=>{
    const t = d.transaction('imgs', mode);
    const rq = fn(t.objectStore('imgs'));
    t.oncomplete = ()=> res(rq && rq.result);
    t.onerror    = ()=> rej(t.error);
  }));
  return {
    put: (k,v)=> run('readwrite', s=>s.put(v,k)),
    del: (k)  => run('readwrite', s=>s.delete(k)),
    all: ()   => db().then(d => new Promise((res,rej)=>{
      const out = {};
      const t = d.transaction('imgs','readonly');
      const c = t.objectStore('imgs').openCursor();
      c.onsuccess = e => { const cur = e.target.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else res(out); };
      t.onerror = ()=> rej(t.error);
    }))
  };
})();

const IMG = {};                                   // id -> dataURL（内存缓存）
const isRef  = r => typeof r==='string' && r.startsWith('idb:');
const isLib  = r => typeof r==='string' && r.startsWith('lib:');
const imgSrc = r => !r ? ''
  : isRef(r) ? (IMG[r.slice(4)] || '')

/* =========================================================
   0b. 媒体 Logo 图库：域名 / 名称 → logo
   ========================================================= */
function domainOf(url){
  const m = /^(?:https?:)?\/\/([^/?#]+)/i.exec((url||'').trim())
         || /^([\w-]+(?:\.[\w-]+)+)/.exec((url||'').trim());
  if(!m) return '';
  return m[1].toLowerCase().split(':')[0].replace(/^(www\d?|m|amp|mobile|en)\./,'');
}
function registrable(host){
  if(!host) return '';
  const p = host.split('.');
  if(p.length <= 2) return host;
  if(['co','com','net','org','gov','edu','ac'].includes(p[p.length-2]) && p[p.length-1].length===2)
    return p.slice(-3).join('.');
  return p.slice(-2).join('.');
}
const normName = s => (s||'').toLowerCase().replace(/\.[a-z0-9]{2,4}$/,'').replace(/[^a-z0-9一-龥]+/g,'');

const LOGOS = (()=>{
  const list = Array.isArray(window.LOGO_LIB) ? window.LOGO_LIB : [];
  const byKey = new Map(), byDomain = new Map(), byName = new Map();
  list.forEach(e=>{
    e.key = (e.d && e.d[0]) || normName(e.n);
    byKey.set(e.key, e);
    (e.d||[]).forEach(d=>{ if(!byDomain.has(d)) byDomain.set(d, e); });
    const n = normName(e.n);
    if(n && !byName.has(n)) byName.set(n, e);
  });
  return {
    list, byKey, byDomain, byName,
    count: list.length,
    withLogo: list.filter(e=>e.i).length,
    /** 先按域名（逐级去掉子域），再按名称 */
    find(url, name){
      const host = domainOf(url);
      if(host){
        if(byDomain.has(host)) return byDomain.get(host);
        const parts = host.split('.');
        for(let i=1;i<parts.length-1;i++){
          const h = parts.slice(i).join('.');
          if(byDomain.has(h)) return byDomain.get(h);
        }
        const r = registrable(host);
        if(byDomain.has(r)) return byDomain.get(r);
      }
      const n = normName(name);
      return (n && byName.get(n)) || null;
    }
  };
})();

/** 用图库补全条目：只填空位，不覆盖已有内容
 *  注意 logo 与截图分属两个字段：r.logo = 品牌 logo，r.img = 页面截图，互不覆盖 */
function enrich(r, force){
  const e = LOGOS.find(r.url, r.name);
  if(e){
    if(!r.name || isUrl(r.name)) r.name = e.n;
    if(!r.sub && e.s) r.sub = e.s;
    if(e.i && (force || !r.logo)) r.logo = 'lib:' + e.key;
  } else if(r.url && (!r.name || isUrl(r.name))){
    r.name = registrable(domainOf(r.url)) || r.name;      // 图库里没有 → 至少显示域名
  }
  return r;
}
function enrichAll(force){
  let hit = 0;
  state.sections.forEach(s=>s.rows.forEach(r=>{
    const before = r.logo;
    enrich(r, force);
    if(r.logo && r.logo !== before) hit++;
  }));
  return hit;
}

/** 压缩后存入 IDB，返回引用 idb:xxx */
function shrink(file, maxW=1400, q=0.82){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        const sc = Math.min(1, maxW / im.naturalWidth);
        const w = Math.max(1,Math.round(im.naturalWidth*sc));
        const h = Math.max(1,Math.round(im.naturalHeight*sc));
        const cv = document.createElement('canvas');
        cv.width=w; cv.height=h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);   // JPEG 无透明通道，先铺白底
        ctx.drawImage(im,0,0,w,h);
        res(cv.toDataURL('image/jpeg', q));
      };
      im.onerror = ()=>rej(new Error('图片解码失败'));
      im.src = fr.result;
    };
    fr.onerror = ()=>rej(fr.error);
    fr.readAsDataURL(file);
  });
}
async function storeImg(file, maxW){
  const url = await shrink(file, maxW);
  const id  = 'im' + uid();
  IMG[id] = url;
  await IDB.put(id, url);
  return 'idb:' + id;
}
function bytesOf(dataUrl){ return Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 3/4); }
function updateStoreInfo(){
  const n = Object.keys(IMG).length;
  const kb = Object.values(IMG).reduce((a,b)=>a+bytesOf(b),0)/1024;
  const size = kb>1024 ? (kb/1024).toFixed(1)+' MB' : Math.round(kb)+' KB';
  document.getElementById('storeInfo').textContent = t('st.imgs', n, size);
  document.getElementById('libTip').innerHTML =
    LOGOS.count ? t('st.lib', LOGOS.count, LOGOS.withLogo) : t('st.noLib');
  const li = document.getElementById('libInfo');
  if(li) li.textContent = t('st.libN', LOGOS.count);
}

/* =========================================================
   2. 解析：TSV / CSV / Excel 的 text/html（含单元格超链接）
   ========================================================= */
function parseHtmlTable(html){
  const doc = new DOMParser().parseFromString(html,'text/html');
  const table = doc.querySelector('table');
  if(!table) return null;
  const trs = [...table.querySelectorAll('tr')];
  if(!trs.length) return null;
  const rows = [], links = [];
  for(const tr of trs){
    const cells = [...tr.querySelectorAll('th,td')];
    if(!cells.length) continue;
    rows.push(cells.map(c => (c.textContent||'').replace(/\s+/g,' ').trim()));
    links.push(cells.map(c => {
      const a = c.querySelector('a[href]');
      const h = a ? a.getAttribute('href') : '';
      return (h && !/^#|^javascript:/i.test(h)) ? h : '';
    }));
  }
  return {rows, links};
}

function parseDelimited(text){
  const t = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!t) return [];
  const delim = (t.split('\n')[0].includes('\t')) ? '\t' : ',';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"'){ q=true; }
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==''));
}

function buildImportData(rows, links, hasHeader){
  if(!rows || !rows.length) return null;
  const width = Math.max(...rows.map(r=>r.length));
  rows = rows.map(r => { const c=r.slice(); while(c.length<width) c.push(''); return c; });

  let linkCols = [];
  if(links){
    links = links.map(r => { const c=r.slice(); while(c.length<width) c.push(''); return c; });
    const start = hasHeader ? 1 : 0;
    for(let c=0;c<width;c++) if(links.slice(start).some(r=>r[c])) linkCols.push(c);
  }

  let headers;
  if(hasHeader){
    headers = rows[0].map((h,i)=> h || ('列'+(i+1)));
    rows = rows.slice(1);
    if(links) links = links.slice(1);
  } else {
    headers = Array.from({length:width},(_,i)=>'列'+(i+1));
  }

  linkCols.forEach(c=>{
    headers.push('⟨'+headers[c]+' 的超链接⟩');
    rows.forEach((r,ri)=> r.push(links[ri] ? (links[ri][c]||'') : ''));
  });

  return {headers, rows};
}

const isUrl = s => /^(https?:\/\/|www\.)\S+$/i.test((s||'').trim());
function guessMap(d){
  const {headers, rows} = d;
  const sample = rows.slice(0,20);
  const score = kw => headers.findIndex(h => kw.some(k=>h.toLowerCase().includes(k)));
  const urlByHeader = score(['url','link','链接','网址','超链接']);
  const urlByData   = headers.findIndex((_,c)=> sample.filter(r=>isUrl(r[c])).length > sample.length*0.6);
  const nameIdx = score(['name','媒体','名称','标题','outlet','publisher','title']);
  return {
    name: nameIdx >= 0 ? nameIdx : 0,
    sub:  score(['地区','城市','location','city','state','备注','说明','sub','市场']),
    url:  urlByHeader >= 0 ? urlByHeader : urlByData,
    img:  score(['logo','图片','image','icon','截图','screenshot','缩略']),
    group:score(['分组','板块','类别','分类','section','group','category','channel','渠道'])
  };
}

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function normUrl(u){
  u = (u||'').trim();
  if(!u) return '';
  if(/^(https?:|mailto:|#)/i.test(u)) return u;
  return 'https://' + u.replace(/^\/+/,'');
}
const SHOT_LAYOUTS = ['s1','s2','s3'];
const TILE_LAYOUTS = ['t2','t3','t4'];
const isShot = l => SHOT_LAYOUTS.includes(l);
const isTile = l => TILE_LAYOUTS.includes(l);

function rowHtml(sid, i, r, layout){
  const url = normUrl(r.url);
  const bind = `data-sid="${sid}" data-idx="${i}"`;
  const nameEl = url
    ? `<a href="${esc(url)}" ${bind} data-f="name" contenteditable="true">${esc(r.name)}</a>`
    : `<span ${bind} data-f="name" contenteditable="true" style="font-weight:700;color:#111827;font-size:12.5px">${esc(r.name)}</span>`;
  const subEl = r.sub ? `<div class="sub" ${bind} data-f="sub" contenteditable="true">${esc(r.sub)}</div>` : '';
  const logo = imgSrc(r.logo);          // 品牌 logo（图库/图片列）
  const shot = imgSrc(r.img);           // 页面截图（拖入/粘贴/批量）
  const src  = shot || logo;

  if(isTile(layout)){
    const inner = logo
      ? `<img src="${esc(logo)}" alt="${esc(r.name)}" title="${esc(r.name)}">`
      : `<span class="nm" ${bind} data-f="name" contenteditable="true">${esc(r.name)}</span>`;
    return `<div class="tile" ${bind}>${
      url && logo ? `<a href="${esc(url)}" style="display:flex;align-items:center;justify-content:center;width:100%">${inner}</a>`
                  : (url ? `<a href="${esc(url)}" ${bind} data-f="name" contenteditable="true">${esc(r.name)}</a>` : inner)
    }</div>`;
  }
  if(isShot(layout)){
    // 没有截图时用 logo 顶上，但必须完整显示 + 留白，不能像截图那样裁切铺满
    const frame = src
      ? `<span class="frame${shot?'':' logo-bg'}"><img class="${shot?'':'as-logo'}" src="${esc(src)}" alt=""></span>`
      : `<span class="frame empty noprint">${esc(t('doc.drop'))}</span>`;
    const inner = url ? `<a href="${esc(url)}" style="display:block">${frame}</a>` : frame;
    return `<figure class="shot" ${bind}>${inner}<figcaption>${nameEl}${subEl}</figcaption></figure>`;
  }
  if(layout==='list')  return `<li ${bind}>${nameEl}${r.sub?` <span class="sub" ${bind} data-f="sub" contenteditable="true">— ${esc(r.sub)}</span>`:''}</li>`;
  if(layout==='chips') return `<span class="chip" ${bind}>${nameEl}</span>`;
  if(layout==='table') return `<tr ${bind}><td>${nameEl}</td><td ${bind} data-f="sub" contenteditable="true">${esc(r.sub||'')}</td>`
    + `<td style="width:34%">${src?`<img src="${esc(src)}" alt="" style="${shot?'':'max-height:34px'}">`:''}</td>`
    + `<td style="word-break:break-all;font-size:11px">${url?`<a href="${esc(url)}">${esc(url)}</a>`:''}</td></tr>`;

  const center = (layout==='c4' && !r.sub && !logo) ? ' center' : '';
  return `<div class="card${center}" ${bind}><div class="txt">${nameEl}${subEl}</div>${logo?`<img class="logo" src="${esc(logo)}" alt="">`:''}</div>`;
}

/* 区块类型：links=链接卡片 / directory=媒体名录 / social=分享行 / summary=报告摘要 */
function sectionHtml(s){
  const bar  = `<div class="sec-bar" data-sid="${s.id}" data-f="title" contenteditable="true">${esc(s.title)}</div>`;
  const desc = s.desc ? `<p class="sec-desc" data-sid="${s.id}" data-f="desc" contenteditable="true">${esc(s.desc)}</p>` : '';
  const wrap = body => `<div class="section" id="sec-${s.id}" data-sec="${s.id}">${bar}${desc}${body}</div>`;
  if(s.type === 'directory') return wrap(directoryHtml(s));
  if(s.type === 'social')    return wrap(socialHtml(s));
  if(s.type === 'summary')   return wrap(summaryHtml(s));
  return linksSectionHtml(s, wrap);
}

/* 灰底盒：世界媒体名录（纯文字条目）与 EIN 行业频道（带链接条目）共用 */
function directoryHtml(s){

function summaryHtml(s){
  const f = s.summary || {};
  const li = (arr, fn) => (arr||[]).length ? `<ul>${arr.map(fn).join('')}</ul>` : '<p class="muted">—</p>';

      <h4>Embedded Videos: ${f.videos||0} video${(f.videos||0)===1?'':'s'}</h4>

  </div>`;

function linksSectionHtml(s, wrap){
  const rows = s.rows.filter(r=>r.name || r.url || r.img || r.logo);
  let body='';
  if(isTile(s.layout))        body = `<div class="tiles ${s.layout}">${rows.map((r,i)=>rowHtml(s.id,i,r,s.layout)).join('')}</div>`;
  else if(s.layout==='list')  body = `<ul class="linklist">${rows.map((r,i)=>rowHtml(s.id,i,r,'list')).join('')}</ul>`;
  else if(s.layout==='chips') body = `<div class="chips">${rows.map((r,i)=>rowHtml(s.id,i,r,'chips')).join('')}</div>`;
  else if(s.layout==='table') body = `<table class="tbl"><thead><tr><th>${esc(t('doc.tName'))}</th><th>${esc(t('doc.tSub'))}</th><th>${esc(t('doc.tShot'))}</th><th>${esc(t('doc.tLink'))}</th></tr></thead><tbody>${rows.map((r,i)=>rowHtml(s.id,i,r,'table')).join('')}</tbody></table>`;
  else                        body = `<div class="cards ${s.layout}">${rows.map((r,i)=>rowHtml(s.id,i,r,s.layout)).join('')}</div>`;

  const heroSrc = imgSrc(s.hero);
  const hero = heroSrc ? `<figure class="sec-hero"><img src="${esc(heroSrc)}" alt="">${
      s.heroCap ? `<figcaption class="figcap" data-sid="${s.id}" data-f="heroCap" contenteditable="true">${esc(s.heroCap)}</figcaption>` : ''
    }</figure>` : '';
  return wrap(hero + body);
}

/* 按文件名匹配条目（normName 见 0b 节） */
async function assignByName(s, files){
  const used = new Set();
  const pending = [];
  for(const f of files){
    const key = normName(f.name);
    let i = s.rows.findIndex((r,ix)=> !used.has(ix) && normName(r.name) === key);
    if(i < 0) i = s.rows.findIndex((r,ix)=> !used.has(ix) && key && normName(r.name) && (key.includes(normName(r.name)) || normName(r.name).includes(key)));
    if(i < 0){
      const m = f.name.match(/^(\d{1,3})[^\d]/);                  // 01_xxx.png → 第 1 条
      if(m){ const k = +m[1]-1; if(k>=0 && k<s.rows.length && !used.has(k)) i = k; }
    }
    if(i >= 0){ used.add(i); s.rows[i].img = await storeImg(f); }
    else pending.push(f);
  }
  for(const f of pending){                                        // 剩下的按顺序补空位
    const i = s.rows.findIndex((r,ix)=> !used.has(ix) && !r.img);
    if(i < 0) break;
    used.add(i); s.rows[i].img = await storeImg(f);
  }
  return {matched: used.size, total: files.length};
}

function typeBodyHtml(s){
  if(s.type === 'directory'){
    const txt = (s.regions||[]).map(g=>
      `${g.flag||''} ${g.name||''} ## ${g.count||''} ## ${g.url||''}\n` +
      (g.names||[]).map(n=> typeof n==='string' ? n : (n.u ? n.n+'\t'+n.u : n.n)).join('\n')
    ).join('\n---\n');
    return `<label>${t('sec.regions')}</label>
      <textarea data-act="regions" rows="12">${esc(txt)}</textarea>`;
  }
  if(s.type === 'social'){
    return `<label>${esc(t('sec.social'))}</label>
      <textarea data-act="rows" rows="5">${esc(s.rows.map(r=>[r.name,r.url||''].join('\t')).join('\n'))}</textarea>`;
  }
  if(s.type === 'summary'){
    const f = s.summary || {};
    return `<label>${esc(t('sum.titleStat'))}</label><input type="text" data-act="sum.titleStat" value="${esc(f.titleStat||'')}" placeholder="15 words, 93 characters">
      <label>${esc(t('sum.titleText'))}</label><textarea data-act="sum.titleText" rows="2">${esc(f.titleText||'')}</textarea>
      <label>${esc(t('sum.textStat'))}</label><input type="text" data-act="sum.textStat" value="${esc(f.textStat||'')}" placeholder="820 words, 6094 characters">
      <label>${esc(t('sum.textExcerpt'))}</label><textarea data-act="sum.textExcerpt" rows="4">${esc(f.textExcerpt||'')}</textarea>
      <label>${esc(t('sum.anchors'))}</label>
      <textarea data-act="sum.anchors" rows="3">${esc((f.anchors||[]).map(a=>[a.text,a.url].join('\t')).join('\n'))}</textarea>
      <label>${esc(t('sum.others'))}</label>
      <textarea data-act="sum.others" rows="3">${esc((f.others||[]).join('\n'))}</textarea>
      <label>${esc(t('sum.images'))}</label>
      <textarea data-act="sum.images" rows="3">${esc((f.images||[]).map(i=>[i.name,i.caption,i.url||''].join('\t')).join('\n'))}</textarea>

document.getElementById('secList').addEventListener('input', e=>{
  const el = e.target.closest('[data-act]');
  if(!el || el.tagName==='BUTTON' || el.type==='file') return;
  const sid = el.closest('.sec-item').dataset.sid;
  const s = state.sections.find(x=>x.id===sid); if(!s) return;
  const act = el.dataset.act;
  if(act==='regions'){
    s.regions = el.value.split(/\n-{3,}\n/).map(blk=>{
      const lines = blk.split('\n').map(x=>x.trim()).filter(Boolean);
      if(!lines.length) return null;
      const [head, count, url] = lines[0].split('##').map(x=>(x||'').trim());
      const m = /^(\p{Extended_Pictographic}|[\u{1F1E6}-\u{1F1FF}]{2})\s*(.*)$/u.exec(head||'');
      const names = lines.slice(1).map(ln=>{
        const [n, u] = ln.split('\t');
        return u ? {n:n.trim(), u:u.trim()} : ln;
      });
      return {flag: m?m[1]:'', name: m?m[2]:(head||''), count: count||'', url: url||'', names};
    }).filter(Boolean);
  } else if(act.startsWith('sum.')){
    const f = s.summary = s.summary || {};
    const k = act.slice(4), v = el.value;
    if(k==='anchors')      f.anchors = parseDelimited(v).map(c=>({text:c[0]||'', url:c[1]||''}));
    else if(k==='others')  f.others  = v.split('\n').map(x=>x.trim()).filter(Boolean);
    else if(k==='images')  f.images  = parseDelimited(v).map((c,i)=>({
                             name:c[0]||'', caption:c[1]||'', url:c[2]||'',
                             img:(f.images&&f.images[i]&&f.images[i].img)||'' }));
    else if(k==='videos')  f.videos  = parseInt(v,10) || 0;
    else                   f[k] = v;
  } else if(act==='rows' && s.type==='social'){
    s.rows = parseDelimited(el.value).map(c=>({name:c[0]||'', sub:'', url:c[1]||'', img:'', logo:''}));
  } else if(act==='rows'){
    const old = s.rows;
    s.rows = parseDelimited(el.value).map((c,i)=>{
      const r = {
        name:c[0]||'', sub:c[1]||'', url:c[2]||'',
        img :(old[i]&&old[i].img )||'',       // 保留已配好的截图
        logo:(old[i]&&old[i].logo)||''        // 和 logo
      };
      if(!r.url && isUrl(r.name)) r.url = r.name;
      return enrich(r);                        // 只填空位
    });
  } else s[act] = el.value;
  render();
  const it = document.querySelector(`.sec-item[data-sid="${sid}"]`);
  if(it){ it.classList.add('open'); const same = it.querySelector(`[data-act="${act}"]`); if(same && act!=='rows') same.focus(); }
});

  if(!importData || !importData.rows.length){ alert(t('a.noData')); return; }
  const [ni,si,ui,ii,gr] = ['mName','mSub','mUrl','mImg','mGroup'].map(id=>+$(id).value);
  const layout = $('mLayout').value;
  const auto = $('mAuto').checked;
  const mk = r => {
    const row = {name:(r[ni]||'').trim(), sub:si>=0?(r[si]||'').trim():'', url:ui>=0?(r[ui]||'').trim():'',
                 logo:ii>=0?(r[ii]||'').trim():'', img:''};
    if(!row.url && isUrl(row.name)) row.url = row.name;      // 只粘了一列链接的情况
    return auto ? enrich(row) : row;
  };

  if(gr >= 0){
    const groups = new Map();
    importData.rows.forEach(r=>{
      const key = (r[gr]||'未分组').trim() || '未分组';
      if(!groups.has(key)) groups.set(key,[]);
      groups.get(key).push(mk(r));
    });
    for(const [title, rows] of groups){
      const exist = state.sections.find(s=>s.title===title);
      if(exist) exist.rows.push(...rows);
      else state.sections.push({id:uid(), title, desc:'', layout, hero:'', heroCap:'', rows});
    }
  } else {
    const rows = importData.rows.map(mk);
    const t = $('mTarget').value;
    if(t === '__new') state.sections.push({id:uid(), title:'新分组', desc:'', layout, hero:'', heroCap:'', rows});
    else { const s = state.sections.find(x=>x.id===t); s.rows.push(...rows); s.layout = layout; }
  }
  modal.classList.remove('on');
  render();
};

/* 补齐缺失字段，兼容旧版本存档 */
function normalizeState(){
  state.sections.forEach(s=>{
    s.id = s.id || uid();
    s.type = s.type||'links'; s.rows = s.rows||[]; s.regions = s.regions||[];
    s.hero = s.hero||''; s.heroCap = s.heroCap||'';
    s.rows.forEach(r=>{
      r.img = r.img||''; r.logo = r.logo||'';
      if(isLib(r.img)){ r.logo = r.img; r.img = ''; }   // 旧版本把 logo 存在 img 里，迁移过来
    });
  });
}

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* 项目 JSON 里内嵌所有用到的图片，换电脑也能复原 */
function usedRefs(){
  const set = new Set();
  const add = v => { if(isRef(v)) set.add(v.slice(4)); };
  add(state.logo); add(state.cover);
  state.sections.forEach(s=>{
    add(s.hero);
    (s.rows||[]).forEach(r=>{ add(r.img); add(r.logo); });
    ((s.summary&&s.summary.images)||[]).forEach(i=>add(i.img));
  });
  return [...set];
}
$('btnSave').onclick = ()=>{
  const _images = {};
  usedRefs().forEach(id=>{ if(IMG[id]) _images[id] = IMG[id]; });
  download('pr-report.json', JSON.stringify({...state, _images}, null, 2), 'application/json');
};
$('btnLoad').onclick = ()=> $('fProj').click();
$('fProj').onchange = e=>{
  const f = e.target.files[0]; e.target.value='';
  if(!f) return;
  const rd = new FileReader();
  rd.onload = async ()=>{
    try{
      const obj = JSON.parse(rd.result);
      const imgs = obj._images || {};
      delete obj._images;
      for(const [id,url] of Object.entries(imgs)){ IMG[id]=url; await IDB.put(id,url); }
      state = Object.assign(defaultState(), obj);
      selected = null;
      normalizeState();
      syncFields(); render();
    }catch(err){ alert(t('a.loadFail', err.message)); }
  };
  rd.readAsText(f);
};

/** Google Docs 只认表格 + 内联样式，不认 grid/flex，所以单独生成一份 */
function toDocHtml(){
  const N = state.navy, A = state.accent;
  const imgTag = (ref, w) => { const s = imgSrc(ref); return s ? `<img src="${esc(s)}" width="${w}" style="max-width:100%">` : ''; };
  const cell = (r, mode, w) => {
    const u = normUrl(r.url);
    const link = inner => u ? `<a href="${esc(u)}" style="color:#111827;font-weight:bold;text-decoration:none">${inner}</a>` : inner;
    if(mode === 'tile'){                                   // 品牌方块：有图放图，无图放名称
      return r.logo ? link(imgTag(r.logo, Math.min(w, 150))) : link(esc(r.name));
    }
    const nm  = link(esc(r.name));
    const pic = (mode==='shot' && (r.img||r.logo)) ? link(imgTag(r.img||r.logo, r.img ? w : Math.min(w,150))) + '<br>' : '';
    const logo= (mode==='text' && r.logo) ? '<br>' + imgTag(r.logo, 90) : '';
    return `${pic}${nm}${r.sub?`<br><span style="font-size:9pt;color:#6b7280">${esc(r.sub)}</span>`:''}${logo}`;
  };
  const gridTable = (rows, cols, mode) => {
    const w = Math.floor(640/cols);
    const align = mode==='tile' ? 'middle" align="center' : 'top';
    let h = `<table width="100%" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:10pt">`;
    for(let i=0;i<rows.length;i+=cols){
      h += '<tr>';
      for(let c=0;c<cols;c++){
        const r = rows[i+c];
        h += `<td width="${Math.floor(100/cols)}%" style="border:1px solid #e5e7eb" valign="${align}">${r?cell(r,mode,w):''}</td>`;
      }
      h += '</tr>';
    }
    return h + '</table>';
  };
  const colsOf = l => ({c1:1,c2:2,c3:3,c4:4,t2:2,t3:3,t4:4,s1:1,s2:2,s3:3,list:2,chips:3,table:1}[l] || 2);
  const modeOf = l => isTile(l) ? 'tile' : (isShot(l) ? 'shot' : 'text');
  const bar = t => `<p style="background:${N};color:#ffffff;padding:6pt 9pt;font-size:11pt;font-weight:bold;border-left:4pt solid ${A};margin:16pt 0 6pt">${esc(t)}</p>`;

  let body = `
    <p style="font-size:16pt;font-weight:bold;color:${N};margin:0">${esc(state.brand)}</p>
    <p style="font-size:9pt;color:#6b7280;margin:0 0 14pt">${esc(state.tagline)}</p>
    <h1 style="font-size:19pt;line-height:1.3;margin:0 0 4pt">${esc(state.title)}</h1>
    <p style="font-size:9.5pt;color:#6b7280;margin:0 0 10pt">${esc(state.subtitle)}</p>
    ${state.intro?`<p style="font-size:10pt;line-height:1.6;color:#374151">${esc(state.intro)}</p>`:''}
    ${state.cover?`<p>${imgTag(state.cover,640)}</p>${state.coverCap?`<p style="font-size:9pt;color:#6b7280;text-align:center;margin-top:-6pt">${esc(state.coverCap)}</p>`:''}`:''}`;

  if(state.toc){
    body += `<p style="font-size:9pt;letter-spacing:1px;color:#6b7280;margin:14pt 0 4pt"><b>目录 CONTENTS</b></p><ul style="font-size:10pt;line-height:1.7">`
      + state.sections.map(s=>`<li>${esc(s.title)}</li>`).join('') + `</ul>`;
  }

  for(const s of state.sections){
    const rows = (s.rows||[]).filter(r=>r.name||r.url||r.img||r.logo);
    body += bar(s.title);
    if(s.desc) body += `<p style="font-size:9.5pt;color:#4b5563;line-height:1.6;margin:0 0 6pt">${esc(s.desc)}</p>`;
    if(s.hero) body += `<p>${imgTag(s.hero,640)}</p>${s.heroCap?`<p style="font-size:9pt;color:#6b7280;text-align:center;margin-top:-6pt">${esc(s.heroCap)}</p>`:''}`;

    if(s.type === 'directory'){
      for(const g of s.regions||[]){
        body += `<p style="margin:8pt 0 2pt"><b>${esc((g.flag?g.flag+' ':'')+g.name)}</b>${
          g.count?` <span style="font-size:9pt;color:#6b7280">${esc(g.count)}</span>`:''}</p>`;
        const n = g.names||[];
        const cell = x => x == null ? ''
          : '▪ ' + (typeof x === 'string' ? esc(x)
                    : (x.u ? `<a href="${esc(normUrl(x.u))}">${esc(x.n)}</a>` : esc(x.n)));
        body += `<table width="100%" cellpadding="3" cellspacing="0" style="font-size:9pt;border-collapse:collapse">`;
        for(let i=0;i<n.length;i+=3){
          body += '<tr>' + [0,1,2].map(c=>`<td width="33%">${cell(n[i+c])}</td>`).join('') + '</tr>';
        }
        body += `</table>`;
      }
      continue;
    }
    if(s.type === 'social'){
      body += gridTable(rows, 4, 'tile');
      continue;
    }
    if(s.type === 'summary'){
      const f = s.summary||{};
      const ul = (a,fn)=> (a||[]).length ? `<ul style="font-size:9.5pt">${a.map(fn).join('')}</ul>` : '';
      body += `<p style="font-size:10pt"><b>Title: ${esc(f.titleStat||'')}</b><br>${esc(f.titleText||'')}</p>`
            + `<p style="font-size:10pt"><b>Text: ${esc(f.textStat||'')}</b><br>${esc(f.textExcerpt||'')}</p>`
            + `<p style="font-size:10pt"><b>Keyword Anchor Text Links: ${(f.anchors||[]).length}</b></p>`
            + ul(f.anchors, a=>`<li>${esc(a.text||'')}${a.url?` - <a href="${esc(normUrl(a.url))}">${esc(a.url)}</a>`:''}</li>`)
            + `<p style="font-size:10pt"><b>Other Links: ${(f.others||[]).length}</b></p>`
            + ul(f.others, u=>`<li><a href="${esc(normUrl(u))}">${esc(u)}</a></li>`)
            + `<p style="font-size:10pt"><b>Embedded Images: ${(f.images||[]).length}</b></p>`
            + (f.images||[]).map(im=>`<p style="font-size:9pt">${imgTag(im.img,200)}<br>${esc(im.name||'')}<br>${esc(im.caption||'')}</p>`).join('')
            + `<p style="font-size:10pt"><b>Embedded Videos: ${f.videos||0}</b></p>`;
      continue;
    }

    if(s.layout==='table'){
      body += `<table width="100%" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:10pt">
        <tr><td style="border:1px solid #e5e7eb;background:#f3f4f6"><b>名称</b></td><td style="border:1px solid #e5e7eb;background:#f3f4f6"><b>说明</b></td><td style="border:1px solid #e5e7eb;background:#f3f4f6"><b>截图</b></td></tr>`
        + rows.map(r=>`<tr><td style="border:1px solid #e5e7eb">${cell(r,'plain')}</td><td style="border:1px solid #e5e7eb;font-size:9pt;color:#6b7280">${esc(r.sub||'')}</td><td style="border:1px solid #e5e7eb">${imgTag(r.img||r.logo,200)}</td></tr>`).join('')
        + `</table>`;
    } else {
      body += gridTable(rows, colsOf(s.layout), modeOf(s.layout));
    }
  }

  if(state.linkIndex){
    body += bar('附录：链接清单 Link Index')
      + `<table width="100%" cellpadding="5" cellspacing="0" style="border-collapse:collapse;font-size:9pt">`
      + state.sections.flatMap(s=>s.rows.filter(r=>normUrl(r.url)).map(r=>
        `<tr><td width="30%" style="border:1px solid #e5e7eb">${esc(r.name)}</td><td style="border:1px solid #e5e7eb"><a href="${esc(normUrl(r.url))}">${esc(normUrl(r.url))}</a></td></tr>`)).join('')
      + `</table>`;
  }

  body += `<p style="font-size:9pt;color:#6b7280;margin-top:16pt;border-top:1px solid #e5e7eb;padding-top:6pt">${esc(state.footer)} · 共 ${totalLinks()} 条链接</p>`;
  return `<html><head><meta charset="utf-8"></head><body style="font-family:Arial,'Microsoft YaHei',sans-serif">${body}</body></html>`;
}

$('btnCopyDoc').onclick = async ()=>{
  const html = toDocHtml();
  const note = totalShots() ? t('a.imgNote') : '';
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html' : new Blob([html],{type:'text/html'}),
      'text/plain': new Blob([html.replace(/<[^>]+>/g,' ')],{type:'text/plain'})
    })]);
    alert(t('a.copied') + note);
  }catch(err){
    const d = document.createElement('div');
    d.innerHTML = html; d.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(d);
    const rg = document.createRange(); rg.selectNodeContents(d);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    const ok = document.execCommand('copy');
    sel.removeAllRanges(); d.remove();
    alert(ok ? t('a.copied2') + note : t('a.copyFail'));
  }
};

$('btnDoc').onclick = ()=> download('pr-report.doc', toDocHtml(), 'application/msword');

/* 导出所有截图为独立文件（编号与报告顺序一致，方便在 Canva 里重排）
   图库 logo 不在此列——它们本来就在 logos/ 目录里有原图 */
$('btnShots').onclick = async ()=>{
  const items = [];
  if(state.cover) items.push(['00_封面', state.cover]);
  state.sections.forEach((s,si)=>{
    if(s.hero) items.push([`${String(si+1).padStart(2,'0')}_00_${s.title}_大图`, s.hero]);
    s.rows.forEach((r,ri)=>{ if(r.img) items.push([`${String(si+1).padStart(2,'0')}_${String(ri+1).padStart(2,'0')}_${r.name}`, r.img]); });
  });
  if(!items.length){ alert(t('a.noShots')); return; }
  if(!confirm(t('a.shotsGo', items.length))) return;
  for(const [name, ref] of items){
    const src = imgSrc(ref);
    if(!src) continue;
    const ext = /^data:image\/(\w+)/.exec(src)?.[1]?.replace('jpeg','jpg') || 'jpg';
    const a = document.createElement('a');
    a.href = src;
    a.download = name.replace(/[\\/:*?"<>|]/g,'_').slice(0,60) + '.' + ext;
    a.click();
    await new Promise(r=>setTimeout(r, 220));
  }
};

function download(name, content, type){
  const url = URL.createObjectURL(new Blob([content],{type}));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   11. 启动
   ========================================================= */
(async function init(){
  // IndexedDB 在隐私模式 / 禁用站点数据时可能既不返回也不报错，必须限时兜底，
  // 否则整页会卡在这里渲染不出来。
  try{
    const imgs = await Promise.race([
      IDB.all(),
      new Promise(res=>setTimeout(()=>res(null), 3000))
    ]);
    if(imgs) Object.assign(IMG, imgs);
    else console.warn('IndexedDB 无响应，本次不加载已存图片');
  }catch(e){ console.warn('IndexedDB 不可用，截图将无法跨刷新保留', e); }
  try{
    const saved = localStorage.getItem(LS_KEY);
    if(saved) state = Object.assign(defaultState(), JSON.parse(saved));
  }catch(e){}
  normalizeState();
  if(LOGOS.count) enrichAll(false);          // 图库更新后，老项目自动补上新收录的 logo
  applyLang();
  syncFields();
  if(!state.sections.length) document.getElementById('btnDemo').click(); else render();
})();
